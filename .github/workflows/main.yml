name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'KY'
        required: true
        default: 'KY'

      agent_description:
        description: 'KY'
        required: true
        default: 'KY AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\":\"${{ github.event.inputs.agent_name }}\",\"description\":\"${{ github.event.inputs.agent_description }}\"}"
